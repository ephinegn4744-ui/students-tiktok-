
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ephi TikTok</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:white;
 font-family:Arial,sans-serif;
}
header{
 height:55px;display:flex;align-items:center;
 justify-content:space-between;padding:0 16px;
 border-bottom:1px solid #292929;
 position:sticky;top:0;background:#080808;
}
.logo{font-size:23px;font-weight:bold}
.logo span{color:#ff3155}
.feed{max-width:500px;margin:auto;padding:15px}
.video{
 height:70vh;min-height:400px;
 background:#202020;border-radius:14px;
 position:relative;overflow:hidden;
 display:flex;align-items:center;
 justify-content:center;margin-bottom:20px;
}
video{width:100%;height:100%;object-fit:cover}
.upload{
 position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);
 background:#333;padding:12px;border-radius:10px;
}
.actions{
 position:absolute;right:12px;bottom:65px;
 display:grid;gap:18px;text-align:center;
 font-size:23px;
}
.actions button{
 background:none;border:0;color:white;
 font-size:25px;
}
.info{position:absolute;bottom:12px;left:12px}
nav{
 position:fixed;bottom:0;left:0;width:100%;
 background:#111;border-top:1px solid #333;
 display:flex;justify-content:space-around;
 padding:14px;z-index:5;
}
nav a{color:white;text-decoration:none}
input[type=file]{display:none}
</style>
</head>
<body>
<header>
<div class="logo">Ephi <span>Tube</span></div>
<div>🔍</div>
</header>

<main class="feed">
<div class="video" id="videoBox">
<div class="upload">🎬 Upload a video</div>
<video id="player" controls loop playsinline></video>
<div class="actions">
<button onclick="like()">❤️</button>
<span id="likes">0</span>
<button onclick="alert('Comments coming soon!')">💬</button>
<button onclick="alert('Share coming soon!')">↗️</button>
</div>
<div class="info">
<b>@EphiCreator</b>
<p>Welcome to Ephi Tube! 🎬</p>
</div>
</div>
<label for="file">➕ Upload Video</label>
<input id="file" type="file" accept="video/*">
</main>

<nav>
<a href="#">🏠 Home</a>
<a href="#file">➕ Upload</a>
<a href="#">👤 Profile</a>
</nav>

<script>
let count=0;
function like(){
 count++;
 document.getElementById('likes').textContent=count;
}
document.getElementById('file').onchange=function(){
 const file=this.files[0];
 if(file){
 const player=document.getElementById('player');
 player.src=URL.createObjectURL(file);
 player.play();
 document.querySelector('.upload').style.display='none';
 }
};
</script>
</body>
</html>
